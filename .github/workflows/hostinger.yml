name: Build Hostinger website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-static-deployment
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build and test
        working-directory: source
        run: |
          npm run build
          npm test
          test -s dist/client/index.html
          test -s dist/client/.htaccess
          test -s dist/client/assets/harbor-intro.mp4

      - name: Check out compiled-site branch
        uses: actions/checkout@v4
        with:
          ref: hostinger-deploy
          path: published

      - name: Publish compiled files
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete --exclude='.git' --exclude='.DS_Store' source/dist/client/ published/
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Compiled website is already up to date.'
            exit 0
          fi
          git commit -m "Build website from ${SOURCE_SHA}"
          git push origin HEAD:hostinger-deploy
